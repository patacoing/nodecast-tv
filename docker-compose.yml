services:
  nodecast-tv:
    build: 
      context: .
    container_name: nodecast-tv
    ports:
      # Published on the Tailscale interface only. On 0.0.0.0 the whole
      # application answered on the server's public address, which is not
      # what a private catalogue should do -- and it is the same address a
      # forged token would be presented to.
      #
      # If the machine reboots and Docker starts before tailscaled, the
      # container cannot bind and will fail; restart: unless-stopped brings
      # it back once the interface is up.
      - "100.81.187.102:80:3000"
      # Prometheus metrics, on the Tailscale address like everything else.
      # VictoriaMetrics on this host scrapes it; nothing about the
      # catalogue is exposed here, only counters.
      - "100.81.187.102:9464:9464"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Without this the json-file driver grows without limit. It was at
    # 3.3 MB and nothing was ever going to stop it.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      - NODE_ENV=production
      - PORT=3000 # Internal container port
      # Read from a .env file next to this compose file. Without JWT_SECRET
      # the server falls back to the placeholder in server/auth.js, which is
      # public in the repository: set it.
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRY=${JWT_EXPIRY:-365d}
      # TMDB enrichment stays off entirely when the key is empty.
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_PASS_INTERVAL_HOURS=${TMDB_PASS_INTERVAL_HOURS:-6}
      # --- Telemetry ---------------------------------------------------
      # Logs are structured JSON on stdout whatever happens, so Docker's
      # own driver already holds them and a collector can be added later
      # without touching the application.
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      # Metrics are exposed for scraping from the start. Traces are built
      # either way and go nowhere until this names a collector -- set it to
      # something like http://tempo:4318 and traces, metrics and logs are
      # exported over OTLP as well.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-nodecast-tv}
      - METRICS_PORT=9464
